name: Deploy to App Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # för keyless-inloggning mot Google Cloud

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://peterlagerstrom.se
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          # Inga secrets: dessa värden är publika identifierare.
          workload_identity_provider: projects/366834037012/locations/global/workloadIdentityPools/github/providers/peterlagerstrom-se
          service_account: github-deploy@peterlagerstrom-01.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - id: deploy
        uses: google-github-actions/deploy-appengine@54d5fc7167ec790eb0233905e3cef384221b4619 # v3.0.1
        with:
          project_id: peterlagerstrom-01
          deliverables: app.yaml
          promote: true

      - name: Smoke test
        run: curl --fail --silent --show-error --output /dev/null "${{ steps.deploy.outputs.version_url }}"

      # Behåll versionen som tar trafik plus de två senaste före den
      # (för snabb rollback i Cloud Console). Äldre versioner tas bort.
      - name: Remove old versions
        env:
          PROJECT_ID: peterlagerstrom-01
          KEEP_PREVIOUS: 2
        run: |
          old=$(gcloud app versions list --project "$PROJECT_ID" --service default \
            --filter='traffic_split=0' --sort-by='~version.createTime' \
            --format='value(version.id)' | tail -n +$((KEEP_PREVIOUS + 1)))
          if [ -z "$old" ]; then
            echo "Inga gamla versioner att ta bort."
            exit 0
          fi
          echo "Tar bort:" $old
          gcloud app versions delete $old --project "$PROJECT_ID" --service default --quiet
